name: Integrate analytics and division panels into owner dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-owner-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate-owner:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Patch owner dashboard HTML and CSP; preserve login, secrets, and D1
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !token) throw new Error("Missing Cloudflare Actions credentials.");

          const worker = "aigrowth-owner-dashboard";
          const api = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts";
          const base = api + "/" + worker;
          const auth = { Authorization: "Bearer " + token };

          async function request(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...auth, ...(options.headers || {}) } });
            const bytes = Buffer.from(await response.arrayBuffer());
            let data = {};
            try { data = JSON.parse(bytes.toString("utf8")); } catch {}
            return { response, bytes, data };
          }

          function parseModules(contentType, buffer) {
            const match = /boundary=(?:"([^"]+)"|([^;]+))/i.exec(contentType || "");
            if (!match) throw new Error("Cloudflare source is not multipart; refusing to change the owner Worker.");
            const boundary = match[1] || match[2];
            const modules = [];
            for (const part of buffer.toString("utf8").split("--" + boundary)) {
              const cut = part.indexOf("\r\n\r\n");
              if (cut < 0) continue;
              const headers = part.slice(0, cut);
              const body = part.slice(cut + 4).replace(/\r\n$/, "").replace(/\r\n--$/, "");
              const filename = /filename="([^"]+)"/i.exec(headers)?.[1];
              if (filename && !/^metadata(?:\.|$)/i.test(filename)) modules.push({ filename, source: body });
            }
            return modules;
          }

          function requireSuccess(data, response, label) {
            if (!response.ok || data?.success !== true) {
              const errors = (data?.errors || []).map(e => ({ code: e.code, message: e.message }));
              throw new Error(label + " failed with HTTP " + response.status + ": " + JSON.stringify(errors).slice(0, 900));
            }
          }

          const [settingsGet, sourceGet, versionsGet, deploymentsGet] = await Promise.all([
            request(base + "/settings"),
            request(base + "/content/v2"),
            request(base + "/versions"),
            request(base + "/deployments")
          ]);
          requireSuccess(settingsGet.data, settingsGet.response, "Read owner settings");
          if (!sourceGet.response.ok) throw new Error("Could not download current owner Worker source (HTTP " + sourceGet.response.status + ").");
          requireSuccess(versionsGet.data, versionsGet.response, "List owner versions");
          requireSuccess(deploymentsGet.data, deploymentsGet.response, "List owner deployments");

          const settings = settingsGet.data.result || {};
          const bindings = Array.isArray(settings.bindings) ? settings.bindings : [];
          const hasDashboardPassword = bindings.some(b => b.name === "DASHBOARD_PASSWORD" && b.type === "secret_text");
          const hasIngestToken = bindings.some(b => b.name === "INGEST_TOKEN" && b.type === "secret_text");
          const d1 = bindings.find(b => b.name === "DB" && b.type === "d1");
          if (!hasDashboardPassword || !hasIngestToken || !d1) {
            throw new Error("Expected DASHBOARD_PASSWORD, INGEST_TOKEN, and DB bindings are not all present. No update attempted.");
          }

          const modules = parseModules(sourceGet.response.headers.get("content-type"), sourceGet.bytes);
          const main = modules.find(m => m.filename === "worker.js") || modules[0];
          if (!main) throw new Error("Could not identify owner Worker entry module.");
          let source = main.source;

          const setupHelper = "async function handleAgaDivisionSetup(request, env, url) {\n  const origin = request.headers.get(\"Origin\");\n  if (origin && origin !== url.origin) return json({ ok: false, error: \"origin_not_allowed\" }, 403);\n  const authorization = request.headers.get(\"Authorization\") || \"\";\n  const suppliedPassword = authorization.startsWith(\"Bearer \") ? authorization.slice(7) : \"\";\n  if (!safeEqual(suppliedPassword, String(env.DASHBOARD_PASSWORD || \"\"))) return json({ ok: false, error: \"unauthorized\" }, 401);\n  if (!env.DB) return json({ ok: false, error: \"d1_not_configured\" }, 503);\n  if (request.method !== \"GET\" && request.method !== \"POST\") return json({ ok: false, error: \"method_not_allowed\" }, 405);\n  const root = \"/api/owner/division-setup\";\n  if (request.method === \"GET\" && url.pathname === root + \"/state\") {\n    try {\n      const [dr, ir] = await Promise.all([\n        env.DB.prepare(\"SELECT d.slug,d.name,d.sort_order,d.category,d.mission,d.runtime_status,COALESCE(s.setup_stage,'not_started') setup_stage,COALESCE(s.setup_priority,3) setup_priority,COALESCE(s.owner_notes,'') owner_notes,(SELECT COUNT(*) FROM aga_division_tasks t WHERE t.division_slug=d.slug AND t.status IN ('awaiting_approval','queued','running')) open_tasks FROM aga_division_registry d LEFT JOIN aga_division_setup s ON s.division_slug=d.slug ORDER BY d.sort_order ASC\").all(),\n        env.DB.prepare(\"SELECT i.id,i.division_slug,d.name division_name,i.integration_key,i.label,i.required,i.status connection_status,i.notes integration_notes,i.last_checked_at,COALESCE(s.setup_stage,'not_started') setup_stage,COALESCE(s.documentation_url,'') documentation_url,COALESCE(s.credential_refs_json,'[]') credential_refs_json,COALESCE(s.owner_notes,'') owner_notes FROM aga_division_integrations i JOIN aga_division_registry d ON d.slug=i.division_slug LEFT JOIN aga_division_integration_setup s ON s.integration_id=i.id ORDER BY i.division_slug ASC,i.required DESC,i.label ASC\").all()\n      ]);\n      const divisions = (dr.results || []).map(d => ({ ...d, sort_order:Number(d.sort_order), setup_priority:Number(d.setup_priority||3), open_tasks:Number(d.open_tasks||0) }));\n      const integrations = (ir.results || []).map(i => {\n        let refs=[]; try { refs=JSON.parse(String(i.credential_refs_json||\"[]\")); } catch {}\n        return { ...i, id:Number(i.id), required:Number(i.required)===1, credential_refs:Array.isArray(refs)?refs:[] };\n      });\n      return json({ ok:true, generated_at:new Date().toISOString(), divisions, integrations });\n    } catch { return json({ ok:false, error:\"division_setup_schema_not_ready\" }, 503); }\n  }\n  const dm = new RegExp(\"^\"+root+\"/division/([a-z0-9_-]{2,80})$\").exec(url.pathname);\n  if (request.method === \"POST\" && dm) {\n    let input; try { const raw=await request.text(); if(new TextEncoder().encode(raw).byteLength>16000)return json({ok:false,error:\"body_too_large\"},413); input=JSON.parse(raw); } catch { return json({ok:false,error:\"invalid_json\"},400); }\n    const stage=String(input.setup_stage||\"not_started\"), valid=new Set([\"not_started\",\"in_progress\",\"blocked\",\"ready_for_test\",\"configured\"]);\n    const priority=Math.max(1,Math.min(5,Math.floor(Number(input.setup_priority)||3)));\n    const notes=String(input.owner_notes||\"\").replace(/[\\u0000-\\u001f\\u007f]/g,\" \").trim().slice(0,1000);\n    if(!valid.has(stage))return json({ok:false,error:\"invalid_setup_stage\"},400);\n    const exists=await env.DB.prepare(\"SELECT slug FROM aga_division_registry WHERE slug=?\").bind(dm[1]).first();\n    if(!exists)return json({ok:false,error:\"division_not_found\"},404);\n    try {\n      await env.DB.prepare(\"INSERT INTO aga_division_setup (division_slug,setup_stage,setup_priority,owner_notes) VALUES (?,?,?,?) ON CONFLICT(division_slug) DO UPDATE SET setup_stage=excluded.setup_stage,setup_priority=excluded.setup_priority,owner_notes=excluded.owner_notes,updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')\").bind(dm[1],stage,priority,notes).run();\n      return json({ok:true,division_slug:dm[1],setup_stage:stage,setup_priority:priority});\n    } catch { return json({ok:false,error:\"division_setup_save_failed\"},503); }\n  }\n  const im = new RegExp(\"^\"+root+\"/integration/([0-9]{1,9})$\").exec(url.pathname);\n  if (request.method === \"POST\" && im) {\n    let input; try { const raw=await request.text(); if(new TextEncoder().encode(raw).byteLength>16000)return json({ok:false,error:\"body_too_large\"},413); input=JSON.parse(raw); } catch { return json({ok:false,error:\"invalid_json\"},400); }\n    const id=Number(im[1]), stage=String(input.setup_stage||\"not_started\"), valid=new Set([\"not_started\",\"awaiting_credentials\",\"configured\",\"blocked\",\"ready_for_test\"]);\n    const notes=String(input.owner_notes||\"\").replace(/[\\u0000-\\u001f\\u007f]/g,\" \").trim().slice(0,1000);\n    let doc=String(input.documentation_url||\"\").trim(); if(doc.length>512)return json({ok:false,error:\"documentation_url_too_long\"},400);\n    if(doc){try{const parsed=new URL(doc);if(parsed.protocol!==\"https:\")throw new Error(\"https_required\");}catch{return json({ok:false,error:\"invalid_documentation_url\"},400);}}\n    const refsIn=Array.isArray(input.credential_refs)?input.credential_refs:[],refs=Array.from(new Set(refsIn.map(x=>String(x||\"\").trim().toUpperCase()).filter(Boolean)));\n    if(refs.length>12||refs.some(x=>!/^[A-Z][A-Z0-9_]{1,79}$/.test(x)))return json({ok:false,error:\"credential_refs_must_be_variable_names_only\"},400);\n    if(!valid.has(stage))return json({ok:false,error:\"invalid_setup_stage\"},400);\n    const exists=await env.DB.prepare(\"SELECT id FROM aga_division_integrations WHERE id=?\").bind(id).first();if(!exists)return json({ok:false,error:\"integration_not_found\"},404);\n    try {\n      await env.DB.prepare(\"INSERT INTO aga_division_integration_setup (integration_id,setup_stage,documentation_url,credential_refs_json,owner_notes) VALUES (?,?,?,?,?) ON CONFLICT(integration_id) DO UPDATE SET setup_stage=excluded.setup_stage,documentation_url=excluded.documentation_url,credential_refs_json=excluded.credential_refs_json,owner_notes=excluded.owner_notes,updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')\").bind(id,stage,doc,JSON.stringify(refs),notes).run();\n      return json({ok:true,integration_id:id,setup_stage:stage,live_connection_status_changed:false});\n    } catch { return json({ok:false,error:\"integration_setup_save_failed\"},503); }\n  }\n  return json({ok:false,error:\"endpoint_not_found\"},404);\n}";
          if (!source.includes("function handleAgaDivisionSetup")) {
            const entryAt = source.indexOf("function htmlResponse()");
            if (entryAt < 0) throw new Error("Owner Worker insertion point not found; setup API not added.");
            source = source.slice(0, entryAt) + setupHelper + "\n\n" + source.slice(entryAt);
          }
          const fetchAnchor = "  async fetch(request, env) {\n    const url = new URL(request.url);";
          const fetchReplacement = fetchAnchor + "\n    if (url.pathname === \"/api/owner/division-setup/state\" || url.pathname.startsWith(\"/api/owner/division-setup/division/\") || url.pathname.startsWith(\"/api/owner/division-setup/integration/\")) {\n      return handleAgaDivisionSetup(request, env, url);\n    }";
          if (!source.includes(fetchAnchor)) {
            if (!source.includes("handleAgaDivisionSetup(request, env, url)")) throw new Error("Owner Worker fetch handler anchor not recognized.");
          } else {
            source = source.replace(fetchAnchor, fetchReplacement);
          }

          const dashboardScriptTag = '<script defer src="https://aga-dashboard-bridge.reybyoo.workers.dev/dashboard-panel.js"></script>';
          const setupScriptTag = '<script defer src="https://aga-dashboard-bridge.reybyoo.workers.dev/division-setup-panel.js"></script>';
          const tick = String.fromCharCode(96);
          const htmlStart = source.indexOf("const HTML = " + tick);
          if (htmlStart < 0) throw new Error("Could not identify owner dashboard HTML template.");
          const htmlResponseIndex = source.indexOf("function htmlResponse()", htmlStart);
          const htmlEnd = htmlResponseIndex >= 0 ? source.lastIndexOf(tick, htmlResponseIndex) : -1;
          if (htmlEnd <= htmlStart || source[htmlEnd + 1] !== ";") {
            throw new Error("Could not locate the end of the owner dashboard HTML template.");
          }
          let htmlTemplate = source.slice(htmlStart, htmlEnd);
          if (!htmlTemplate.includes("</head>")) throw new Error("Owner HTML template has no closing head tag.");
          if (!htmlTemplate.includes(dashboardScriptTag)) {
            htmlTemplate = htmlTemplate.replace("</head>", dashboardScriptTag + "\n</head>");
          }
          if (!htmlTemplate.includes(setupScriptTag)) {
            htmlTemplate = htmlTemplate.replace("</head>", setupScriptTag + "\n</head>");
          }
          source = source.slice(0, htmlStart) + htmlTemplate + source.slice(htmlEnd);

          const cspPattern = /"Content-Security-Policy":\s*"default-src 'self';\s*style-src 'self' 'unsafe-inline' https:\/\/fonts\.googleapis\.com;\s*font-src https:\/\/fonts\.gstatic\.com;\s*script-src 'self' 'unsafe-inline';\s*connect-src 'self';\s*img-src 'self' data:;\s*base-uri 'none';\s*frame-ancestors 'none'"/;
          const replacementCsp = '"Content-Security-Policy": "default-src \'self\'; style-src \'self\' \'unsafe-inline\' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src \'self\' \'unsafe-inline\' https://aga-dashboard-bridge.reybyoo.workers.dev; connect-src \'self\' https://aga-dashboard-bridge.reybyoo.workers.dev; img-src \'self\' data:; base-uri \'none\'; frame-ancestors \'none\'"';
          if (cspPattern.test(source)) {
            source = source.replace(cspPattern, replacementCsp);
          } else if (
            source.includes("https://aga-dashboard-bridge.reybyoo.workers.dev/dashboard-panel.js") &&
            source.includes("script-src 'self' 'unsafe-inline' https://aga-dashboard-bridge.reybyoo.workers.dev") &&
            source.includes("connect-src 'self' https://aga-dashboard-bridge.reybyoo.workers.dev")
          ) {
            console.log("Dashboard script and CSP are already present in owner source.");
          } else {
            throw new Error("Existing dashboard CSP was not recognized; no owner Worker update attempted.");
          }

          if (!source.includes(setupScriptTag) ||
              !source.includes("function handleAgaDivisionSetup") ||
              !source.includes("/api/owner/division-setup/state") ||
              !source.includes("live_connection_status_changed: false")) {
            throw new Error("Owner setup API or setup panel source validation failed; owner Worker was not changed.");
          }

          if (!source.includes(dashboardScriptTag) ||
              !source.includes("script-src 'self' 'unsafe-inline' https://aga-dashboard-bridge.reybyoo.workers.dev") ||
              !source.includes("connect-src 'self' https://aga-dashboard-bridge.reybyoo.workers.dev") ||
              !source.includes('id="loginForm"') ||
              !source.includes('id="dashboardView"') ||
              !source.includes("env.DASHBOARD_PASSWORD") ||
              !source.includes("env.INGEST_TOKEN") ||
              !source.includes("env.DB")) {
            throw new Error("Pre-upload source validation failed; owner Worker was not changed.");
          }

          const currentDeployments = deploymentsGet.data.result?.deployments || [];
          const activeDeployment = currentDeployments.find(d => Array.isArray(d.versions) && d.versions.some(v => Number(v.percentage) > 0));
          const previousVersion = activeDeployment?.versions?.find(v => Number(v.percentage) > 0)?.version_id;
          if (!previousVersion) throw new Error("Could not determine currently active owner Worker version; no update attempted.");

          const { writeFile } = await import("node:fs/promises");
          const { spawnSync } = await import("node:child_process");
          const tempPath = "/tmp/owner-worker-check.mjs";
          await writeFile(tempPath, source, "utf8");
          const syntax = spawnSync(process.execPath, ["--check", tempPath], { encoding: "utf8" });
          if (syntax.status !== 0) throw new Error("Patched owner Worker failed syntax check: " + (syntax.stderr || syntax.stdout).slice(0, 1400));

          const { mkdir } = await import("node:fs/promises");
          const workDir = "/tmp/owner-dashboard-wrangler";
          await mkdir(workDir, { recursive: true });
          await writeFile(workDir + "/worker.js", source, "utf8");
          const wranglerConfig = [
            'name = "aigrowth-owner-dashboard"',
            'main = "worker.js"',
            'account_id = "' + account + '"',
            'compatibility_date = "' + (settings.compatibility_date || "2026-10-20") + '"',
            'compatibility_flags = ' + JSON.stringify(settings.compatibility_flags || []),
            'usage_model = "standard"',
            'keep_vars = true',
            '',
            '[triggers]',
            'crons = ["*/5 * * * *"]',
            '',
            '[observability]',
            'enabled = true',
            'head_sampling_rate = 1',
            '',
            '[observability.logs]',
            'invocation_logs = true',
            '',
            '[observability.issues]',
            'enabled = true',
            '',
            '[secrets]',
            'required = ["DASHBOARD_PASSWORD", "INGEST_TOKEN"]',
            '',
            '[[d1_databases]]',
            'binding = "DB"',
            'database_name = "aigrowth-core-db"',
            'database_id = "75a89d50-9efc-487f-bcd6-abe0bdde7c71"',
            ''
          ].join("\n");
          await writeFile(workDir + "/wrangler.toml", wranglerConfig, "utf8");

          const oldVersions = new Set((versionsGet.data.result?.items || []).map(v => v.id).filter(Boolean));
          const wranglerUpload = spawnSync("npx", [
            "--yes", "wrangler@4", "versions", "upload",
            "--config", workDir + "/wrangler.toml",
            "--message", "Add AIGROWTH website analytics and division panels"
          ], {
            cwd: workDir,
            encoding: "utf8",
            env: process.env,
            maxBuffer: 12 * 1024 * 1024
          });
          const uploadOutput = String(wranglerUpload.stdout || "") + "\n" + String(wranglerUpload.stderr || "");
          console.log(uploadOutput.split("\n").slice(-35).join("\n"));
          if (wranglerUpload.status !== 0) {
            throw new Error("Wrangler versions upload failed (exit " + wranglerUpload.status + "). Secrets were not re-created or overwritten.");
          }

          let newVersion = null;
          for (let attempt = 1; attempt <= 16; attempt++) {
            const versions = await request(base + "/versions");
            if (versions.response.ok && versions.data.success === true) {
              newVersion = (versions.data.result?.items || []).find(v => v.id && !oldVersions.has(v.id)) || null;
              if (newVersion) break;
            }
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          if (!newVersion?.id) throw new Error("Wrangler uploaded the owner version but the Cloudflare versions API did not return a new version ID.");

          const deploy = await request(base + "/deployments", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ strategy: "percentage", versions: [{ percentage: 100, version_id: newVersion.id }] })
          });
          requireSuccess(deploy.data, deploy.response, "Activate owner dashboard version");
          console.log("Owner dashboard version " + newVersion.id + " is active. Verifying login markup and integration.");

          try {
            const bridgeBase = "https://aga-dashboard-bridge.reybyoo.workers.dev";
            const ownerUrls = [
              "https://dashboard.aigrowth.my.id/?__aga_owner_verify=" + Date.now(),
              "https://aigrowth-owner-dashboard.reybyoo.workers.dev/?__aga_owner_verify=" + Date.now()
            ];
            const [bridgeHealth, analyticsScript, setupScript, analyticsApi, divisionsApi, ...ownerResponses] = await Promise.all([
              fetch(bridgeBase + "/health", { cache: "no-store" }),
              fetch(bridgeBase + "/dashboard-panel.js", { cache: "no-store" }),
              fetch(bridgeBase + "/division-setup-panel.js", { cache: "no-store" }),
              fetch(bridgeBase + "/api/website-analytics?days=30", {
                headers: { Origin: "https://dashboard.aigrowth.my.id", Accept: "application/json" }, cache: "no-store"
              }),
              fetch(bridgeBase + "/api/divisions", {
                headers: { Origin: "https://dashboard.aigrowth.my.id", Accept: "application/json" }, cache: "no-store"
              }),
              ...ownerUrls.map(url => fetch(url, { redirect: "follow", cache: "no-store" }))
            ]);

            const healthText = await bridgeHealth.text();
            const analyticsScriptText = await analyticsScript.text();
            const setupScriptText = await setupScript.text();
            const analyticsApiText = await analyticsApi.text();
            const divisionsApiText = await divisionsApi.text();
            const ownerChecks = [];
            for (let i = 0; i < ownerResponses.length; i++) {
              const response = ownerResponses[i];
              const html = await response.text();
              const csp = response.headers.get("content-security-policy") || "";
              ownerChecks.push({
                host: new URL(ownerUrls[i]).hostname,
                http: response.status,
                login_form_present: html.includes('id="loginForm"') && html.includes('id="loginView"'),
                dashboard_panel_script_present: html.includes("https://aga-dashboard-bridge.reybyoo.workers.dev/dashboard-panel.js"),
                setup_panel_script_present: html.includes("https://aga-dashboard-bridge.reybyoo.workers.dev/division-setup-panel.js"),
                csp_allows_bridge: csp.includes("script-src") &&
                  csp.includes("connect-src") &&
                  csp.includes("https://aga-dashboard-bridge.reybyoo.workers.dev")
              });
            }

            const unauthenticatedSetupApi = await fetch("https://dashboard.aigrowth.my.id/api/owner/division-setup/state", { cache: "no-store" });
            const unauthenticatedSetupStatus = unauthenticatedSetupApi.status;
            if (unauthenticatedSetupStatus !== 401) throw new Error("Owner setup API must reject requests without the dashboard password (got HTTP " + unauthenticatedSetupStatus + ").");

            const settingsAfter = await request(base + "/settings");
            requireSuccess(settingsAfter.data, settingsAfter.response, "Verify owner Worker settings");
            const finalBindings = settingsAfter.data.result?.bindings || [];
            const preserved = {
              dashboard_password_secret: finalBindings.some(b => b.name === "DASHBOARD_PASSWORD" && b.type === "secret_text"),
              ingest_token_secret: finalBindings.some(b => b.name === "INGEST_TOKEN" && b.type === "secret_text"),
              d1_binding: finalBindings.some(b => b.name === "DB" && b.type === "d1")
            };
            const apiCorsAnalytics = analyticsApi.headers.get("access-control-allow-origin") === "https://dashboard.aigrowth.my.id";
            const apiCorsDivisions = divisionsApi.headers.get("access-control-allow-origin") === "https://dashboard.aigrowth.my.id";
            let analyticsData = {};
            let divisionsData = {};
            try { analyticsData = JSON.parse(analyticsApiText); } catch {}
            try { divisionsData = JSON.parse(divisionsApiText); } catch {}

            const success =
              bridgeHealth.ok && healthText.includes('"ready":true') &&
              analyticsScript.ok && analyticsScriptText.includes("Live Website Analytics") &&
              setupScript.ok && setupScriptText.includes("Division & Integration Setup") &&
              analyticsApi.ok && analyticsData.ok === true && apiCorsAnalytics &&
              divisionsApi.ok && divisionsData.ok === true && apiCorsDivisions &&
              ownerChecks.every(c => c.http === 200 && c.login_form_present && c.dashboard_panel_script_present && c.setup_panel_script_present && c.csp_allows_bridge) &&
              Object.values(preserved).every(Boolean);

            console.log(JSON.stringify({
              status: success ? "success" : "verification_failed",
              worker,
              active_version: newVersion.id,
              previous_version: previousVersion,
              bridge_health_http: bridgeHealth.status,
              analytics_script_http: analyticsScript.status,
              division_setup_script_http: setupScript.status,
              owner_setup_api_unauthenticated_http: unauthenticatedSetupStatus,
              analytics_api_http: analyticsApi.status,
              analytics_api_cors_allowed: apiCorsAnalytics,
              divisions_api_http: divisionsApi.status,
              divisions_api_cors_allowed: apiCorsDivisions,
              division_count: divisionsData.divisions?.length ?? null,
              integration_records: divisionsData.summary?.total_integrations ?? null,
              preserved_bindings: preserved,
              owner_host_checks: ownerChecks
            }, null, 2));
            if (!success) throw new Error("Owner dashboard integration checks failed; the previous Worker version will be restored.");
          } catch (error) {
            const rollback = await request(base + "/deployments", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ strategy: "percentage", versions: [{ percentage: 100, version_id: previousVersion }] })
            });
            console.error("Verification failed: " + String(error) + ". Rollback HTTP " + rollback.response.status + ".");
            throw error;
          }
          NODE