name: Deploy AIGROWTH bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "scripts/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AGA_OWNER_API_TOKEN: ${{ secrets.AGA_OWNER_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Test before deploy
        run: npm test
      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Deployment blocked: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets. No deployment was attempted."
            exit 1
          fi
      - name: Locate existing AIGROWTH D1 database
        id: d1
        run: |
          set -euo pipefail
          npx wrangler@4 d1 list --json > /tmp/d1-list.json
          D1_DATABASE_ID="$(node scripts/resolve-d1-id.mjs /tmp/d1-list.json)"
          echo "database_id=$D1_DATABASE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved existing database aigrowth-core-db."
      - name: Generate D1 binding config
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: node scripts/prepare-wrangler-config.mjs
      - name: Apply analytics migration to existing D1
        run: npx wrangler@4 d1 execute aigrowth-core-db --remote --yes --file=migrations/0001_website_analytics.sql --config=wrangler.deploy.toml
      - name: Apply division registry migration to existing D1
        run: npx wrangler@4 d1 execute aigrowth-core-db --remote --yes --file=migrations/0002_divisions_operations.sql --config=wrangler.deploy.toml
      - name: Apply base expansion to 100 divisions
        run: npx wrangler@4 d1 execute aigrowth-core-db --remote --yes --file=migrations/0003_expand_divisions_to_100.sql --config=wrangler.deploy.toml
      - name: Apply 50 sales specialist divisions to D1
        run: npx wrangler@4 d1 execute aigrowth-core-db --remote --yes --file=migrations/0004_add_50_sales_divisions.sql --config=wrangler.deploy.toml
      - name: Deploy bridge to Cloudflare
        run: npx wrangler@4 deploy --config=wrangler.deploy.toml
      - name: Configure optional Owner task API token
        if: ${{ env.AGA_OWNER_API_TOKEN != '' }}
        run: printf '%s' "$AGA_OWNER_API_TOKEN" | npx wrangler@4 secret put AGA_OWNER_API_TOKEN --name aga-dashboard-bridge
      - name: Verify deployed Worker and D1 schema
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://aga-dashboard-bridge.reybyoo.workers.dev"

          fetch_with_retry() {
            local url="$1"
            local label="$2"
            local body
            local status="000"
            body="$(mktemp)"
            for attempt in {1..12}; do
              status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' "$url" 2>/dev/null || true)"
              if [ "$status" = "200" ]; then
                cat "$body"
                rm -f "$body"
                return 0
              fi
              echo "::notice::$label endpoint is not ready yet (HTTP $status, attempt $attempt/12)." >&2
              sleep 2
            done
            echo "::error::$label endpoint did not become ready after retries (HTTP $status)." >&2
            cat "$body" >&2
            rm -f "$body"
            return 1
          }

          HEALTH="$(fetch_with_retry "$BASE/health" "Health")"
          echo "$HEALTH" | node -e 'let d="";process.stdin.on("data",x=>d+=x).on("end",()=>{const v=JSON.parse(d); if(v.ready!==true || v.configuration?.storageMode!=="shared_d1") { console.error("Bridge not ready or not using shared D1:",v); process.exit(1); } console.log("Health verified: shared D1 is ready.");})'
          ANALYTICS="$(fetch_with_retry "$BASE/api/website-analytics?days=7" "Analytics API")"
          echo "$ANALYTICS" | node -e 'let d="";process.stdin.on("data",x=>d+=x).on("end",()=>{const v=JSON.parse(d); if(v.ok!==true || v.source!=="cloudflare-d1") { console.error("Analytics API verification failed:",v); process.exit(1); } console.log("Analytics API verified; page_views="+(v.summary?.page_views ?? 0));})'
          DIVISIONS="$(fetch_with_retry "$BASE/api/divisions" "Divisions API")"
          echo "$DIVISIONS" | node -e 'let d="";process.stdin.on("data",x=>d+=x).on("end",()=>{const v=JSON.parse(d); if(v.ok!==true || v.divisions?.length!==150 || v.summary?.total_integrations!==310) { console.error("Division registry verification failed:",{divisions:v.divisions?.length,integrations:v.summary?.total_integrations,error:v.error}); process.exit(1); } console.log("Division registry verified: "+v.divisions.length+" divisions and "+v.summary.total_integrations+" integration records.");})'
      - name: Publish activation notes
        if: always()
        run: |
          {
            echo "## AIGROWTH bridge deployment"
            echo "- Workflow: ${{ job.status }}"
            echo "- D1 target: aigrowth-core-db"
            echo "- Next HTML integration after successful deployment:"
            echo "  - Website Worker agencyai: load /tracker.js in head"
            echo "  - Dashboard Worker aigrowth-owner-dashboard: load /dashboard-panel.js in head (it also loads divisions panel)"
          } >> "$GITHUB_STEP_SUMMARY"
